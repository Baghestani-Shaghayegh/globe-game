<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07111c" />
    <!-- Light or dark, set before anything draws so a light-mode player gets
         no dark flash on load. The same rule as src/lib/appearance.ts. -->
    <script>
      try {
        var choice = localStorage.getItem("worldguess.appearance.v1");
        var light =
          choice === "light" ||
          (choice === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (light)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f3f1ec");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <title>GuessGlobe — how much of the world map can you recall?</title>
    <meta
      name="description"
      content="Four daily geography puzzles on a 3D globe: a country hunt, a mystery country, Connect and Five clues. Plus lessons that teach the map, five neighbours at a time."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Installable: home-screen icon, standalone window, no address bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GuessGlobe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- What a shared link looks like. The game lives or dies on people
         passing it around, so this is not decoration. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuessGlobe" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="GuessGlobe — four daily geography puzzles" />
    <meta
      property="og:description"
      content="Find, name and link countries on a 3D globe. New puzzles every day, the same for everyone."
    />
    <!-- A full address: link previews ignore a relative one and show no
         picture at all. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og.png?v=2" />
    <meta property="og:image:alt" content="A globe with countries lit up, and the GuessGlobe name" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GuessGlobe — four daily geography puzzles" />
    <meta
      name="twitter:description"
      content="Find, name and link countries on a 3D globe. New puzzles every day, the same for everyone."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
